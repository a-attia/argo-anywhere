[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-anywhere"
dynamic = ["version"]
description = "Run AI coding CLIs (OpenCode, Claude Code, aider) against the ANL Argo gateway from anywhere -- now a Python package that owns the runtime and adds a local web UI, wrapping the unchanged bash engine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Attia" }]
keywords = ["argo", "anl", "llm", "opencode", "claude-code", "aider", "ssh-tunnel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# One-mode default install: everything a user needs to run the CLI, the local
# web UI (`argo-anywhere web`), and the native desktop window (`argo-anywhere
# app` / the double-clickable launcher from `install-launcher`) is included by
# default. The PTY is driven by the stdlib
# (argo_anywhere.driver.PtySession), so no ptyprocess is needed. pywebview uses
# the OS webview (Cocoa/WebKit on macOS, GTK/Qt on Linux); the code still
# degrades to the default browser if pywebview import fails on an exotic
# platform (defense in depth).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pywebview>=5",
]

[project.optional-dependencies]
# Maintainer / contributor extra: adds the full test suite (pytest + httpx for
# Starlette's TestClient), lint (ruff), and the maintainer-only screenshot
# regeneration path (rich for the client shot; playwright for the web-UI shot
# via headless Chromium -- one-time `python -m playwright install chromium`).
# CI runs `pip install -e .[dev]`.
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # Upper-bounded deliberately. ruff's DEFAULT rule set grows between minor
    # releases, and the lint step is a hard CI gate -- so an unbounded floor
    # means CI's definition of "clean" changes under us with no commit. That
    # is not hypothetical: `ruff>=0.4` resolved to 0.15.22 when v3.2.1
    # published green on 2026-07-16, 0.16.0 promoted a batch of rules into
    # the defaults on 2026-07-23, and by 2026-08-12 the SAME v3.2.1 tree
    # failed with 125 errors. The v3.3.0 tag was the first thing to touch CI
    # after that, so it looked like the release broke the build. See the
    # explicit `select` under [tool.ruff.lint]: pinning the version bounds
    # the blast radius, pinning the rules removes it.
    "ruff>=0.16,<0.17",
    "rich>=13.0",
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/a-attia/argo-anywhere"
Repository = "https://github.com/a-attia/argo-anywhere"

[project.scripts]
argo-anywhere = "argo_anywhere.cli:main"

[tool.setuptools.dynamic]
# Package version is the single source of release identity (D-029); the vendored
# engine's SCRIPT_VERSION is an internal component tag, not this.
version = { attr = "argo_anywhere.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The bash engine is vendored VERBATIM as package-data (D-026); the web UI
# ships its vendored static assets (xterm.js etc.) the same way; assets/ holds
# the app icon used by `install-launcher` for the macOS .app bundle.
argo_anywhere = ["engine/*.sh", "web/static/*", "web/static/**/*", "assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The vendored bash engine + web static assets are not Python; nothing to lint.
extend-exclude = ["src/argo_anywhere/engine", "src/argo_anywhere/web/static"]

[tool.ruff.lint]
# State the rule set explicitly instead of inheriting ruff's defaults.
#
# `E` + `F` (pycodestyle errors + pyflakes) is what ruff's defaults happened to
# mean for every green build this project has had, so this is a codification of
# the existing gate, not a new standard -- no historical commit becomes
# retroactively dirty. Inheriting the default was the actual bug: it let an
# upstream release redefine "clean" for a repo nobody had touched.
#
# Adopting more (B, SIM, UP, I, ...) is a fine idea and a deliberate one: add
# the code here, fix what it finds, in its own commit. One note for whoever
# does that: `BLE001` / `S110` will flag the broad `except Exception` and
# `try/except: pass` in the config writers and focus-raise helpers -- those are
# deliberate (D-034's "degrade, never die"), so they want `# noqa` with a
# reason rather than a rewrite.
select = ["E", "F"]

# E501 (line length) is opt-in even inside `E`, so it was NOT part of the
# historical gate; enabling it here would newly fail ~21 lines that predate
# this change, in files nobody is touching. `line-length = 100` above still
# governs the formatter. Turn this on in its own commit, with the reflow.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from the working tree, without requiring an install.
#
# The suite used to rely on an editable install being present in whatever
# interpreter ran pytest. That is invisible while it works and fails hard the
# moment it does not: removing a stale editable install on 2026-08-12 (it was
# shadowing the pipx-installed release on PATH) broke collection of all 29 test
# modules with ModuleNotFoundError, in a tree where nothing about the tests had
# changed. Making the path explicit means `pytest` tests THIS checkout in any
# interpreter, and never silently tests an installed copy instead.
pythonpath = ["src"]
