[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-anywhere"
dynamic = ["version"]
description = "Run AI coding CLIs (OpenCode, Claude Code, aider) against the ANL Argo gateway from anywhere -- now a Python package that owns the runtime and adds a local web UI, wrapping the unchanged bash engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmed Attia" }]
keywords = ["argo", "anl", "llm", "opencode", "claude-code", "aider", "ssh-tunnel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# Core install has NO third-party dependencies: the engine is bash, driven via
# the stdlib (subprocess / pty). The web UI is an opt-in extra (D-026 Model A).
dependencies = []

[project.optional-dependencies]
# The PTY is driven by the stdlib (argo_anywhere.driver.PtySession), so the web
# extra needs no ptyprocess -- just the HTTP/WS server.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
# Native desktop window (argo-anywhere app). pywebview uses the OS webview
# (Cocoa/WebKit on macOS, GTK/Qt on Linux); it degrades to the browser if absent.
app = [
    "argo-anywhere[web]",
    "pywebview>=5",
]
all = ["argo-anywhere[app]"]
# Dev/test: pytest + httpx (FastAPI's TestClient needs httpx).
test = [
    "argo-anywhere[web]",
    "pytest>=8",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/a-attia/argo-anywhere"
Repository = "https://github.com/a-attia/argo-anywhere"

[project.scripts]
argo-anywhere = "argo_anywhere.cli:main"

[tool.setuptools.dynamic]
# Package version is the single source of release identity (D-029); the vendored
# engine's SCRIPT_VERSION is an internal component tag, not this.
version = { attr = "argo_anywhere.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The bash engine is vendored VERBATIM as package-data (D-026); the web UI
# ships its vendored static assets (xterm.js etc.) the same way; assets/ holds
# the app icon used by `install-launcher` for the macOS .app bundle.
argo_anywhere = ["engine/*.sh", "web/static/*", "web/static/**/*", "assets/*"]
