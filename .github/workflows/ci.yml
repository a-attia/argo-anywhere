name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev extra)
        run: |
          python -m pip install --upgrade pip
          # The dev extra is self-sufficient for the full suite (fastapi +
          # uvicorn + httpx for the web-API tests + ruff for lint). pywebview is
          # intentionally excluded -- it needs a GUI backend CI runners lack, and
          # no test imports it. The bash engine's live tests (real SSH + Duo +
          # argo-proxy) are manual, per docs/TESTING.md; CI covers the Python
          # layer only.
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest)
        run: pytest -q

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check artifacts ship the engine + assets
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          need = [
              "argo_anywhere/engine/argo-anywhere.sh",
              "argo_anywhere/web/static/index.html",
              "argo_anywhere/web/static/xterm.js",
              "argo_anywhere/assets/icon.icns",
          ]
          missing = [n for n in need if not any(n in x for x in names)]
          assert not missing, f"wheel missing data files: {missing}"
          # The LICENSE must ship in the dist-info metadata.
          assert any(x.endswith("licenses/LICENSE") for x in names), "wheel missing LICENSE"
          print("wheel OK:", whl.split("/")[-1])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
