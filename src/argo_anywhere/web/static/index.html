<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>argo-anywhere</title>
  <link rel="stylesheet" href="/static/xterm.css" />
  <style>
    /* ---- instrument-panel tokens (single committed dark look; a terminal
           companion, so it sits with the xterm surface below) -------------- */
    :root {
      color-scheme: dark;
      --bg: #131720;
      --panel: #1a1f2b;
      --panel-raised: #212838;
      --line: #2b3242;
      --line-soft: #242b39;
      --ink: #cdd3de;
      --ink-dim: #8b93a4;
      --ink-faint: #606a7d;
      --up: #46c76a;
      --warn: #e0a53a;
      --down: #f2685f;
      --link: #4fd1cf;      /* channel path + interactive accent */
      --link-soft: rgba(79, 209, 207, 0.13);
      --radius: 8px;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: var(--sans); font-size: 13px; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    #app { display: flex; flex-direction: column; height: 100%; }

    /* ---- top bar ------------------------------------------------------- */
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 16px; background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 600;
             letter-spacing: -0.01em; }
    .brand .mark {
      width: 9px; height: 9px; border-radius: 2px;
      background: var(--link); box-shadow: 0 0 10px var(--link);
    }
    .brand .tag {
      font-family: var(--mono); font-size: 10px; font-weight: 500;
      color: var(--link); background: var(--link-soft);
      padding: 1px 6px; border-radius: 4px; letter-spacing: 0.04em;
    }
    .meta { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
    .meta b { color: var(--ink); font-weight: 500; }
    .spacer { margin-left: auto; }
    .ghost-btn {
      background: transparent; color: var(--ink-dim);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 4px 11px; cursor: pointer; font-size: 12px; font-family: var(--sans);
    }
    .ghost-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

    /* ---- dashboard grid ------------------------------------------------ */
    .dash {
      display: grid; gap: 12px; padding: 14px 16px;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      grid-template-areas: "channel sessions" "channel listeners";
      background: var(--bg);
    }
    .dash[hidden] { display: none; }
    @media (max-width: 780px) {
      .dash { grid-template-columns: 1fr; grid-template-areas: "channel" "sessions" "listeners"; }
    }
    .card {
      background: var(--panel); border: 1px solid var(--line-soft);
      border-radius: var(--radius); padding: 13px 15px 15px;
    }
    .card.channel   { grid-area: channel; }
    .card.sessions  { grid-area: sessions; }
    .card.listeners { grid-area: listeners; }

    .eyebrow {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.13em;
      color: var(--ink-faint); font-weight: 600; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .eyebrow .count {
      font-family: var(--mono); letter-spacing: 0; text-transform: none;
      color: var(--ink-dim); font-weight: 500;
    }

    /* ---- SIGNATURE: the channel signal-path ---------------------------- */
    .signalpath {
      display: flex; align-items: flex-start; gap: 0;
      padding: 6px 2px 14px;
    }
    .hop { display: flex; flex-direction: column; align-items: center; gap: 7px;
           text-align: center; min-width: 74px; --dot: var(--ink-faint); }
    .hop .hopdot {
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--dot); box-shadow: 0 0 0 4px color-mix(in srgb, var(--dot) 16%, transparent);
    }
    .hop.up      { --dot: var(--up); }
    .hop.down    { --dot: var(--down); }
    .hop.unknown { --dot: var(--ink-faint); }
    .hop.up .hopdot { animation: pulse 2.4s ease-in-out infinite; }
    .hop .hoplabel { font-size: 12px; color: var(--ink); }
    .hop .hopsub   { font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim);
                     min-height: 14px; }
    .wire {
      flex: 1; position: relative; height: 13px; min-width: 34px;
      display: flex; align-items: center; justify-content: center;
    }
    .wire::before {
      content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px;
      background: linear-gradient(90deg, var(--from, var(--ink-faint)), var(--to, var(--ink-faint)));
      opacity: 0.75;
    }
    .wire .wirelabel {
      position: relative; font-family: var(--mono); font-size: 10.5px;
      color: var(--link); background: var(--panel); padding: 0 6px;
      border-radius: 4px; z-index: 1; white-space: nowrap;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--dot) 16%, transparent); }
      50%      { box-shadow: 0 0 0 7px color-mix(in srgb, var(--dot) 5%, transparent); }
    }
    @media (prefers-reduced-motion: reduce) { .hop.up .hopdot { animation: none; } }

    .channel-meta {
      font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim);
      border-top: 1px solid var(--line-soft); padding-top: 11px;
      display: flex; flex-wrap: wrap; gap: 4px 18px;
    }
    .channel-meta b { color: var(--ink); font-weight: 500; }
    .channel-actions { display: flex; align-items: center; gap: 11px; margin-top: 12px; }
    .act-btn {
      background: var(--link-soft); color: var(--link);
      border: 1px solid color-mix(in srgb, var(--link) 35%, transparent);
      border-radius: 6px; padding: 5px 13px; cursor: pointer;
      font-size: 12px; font-family: var(--sans); font-weight: 500;
    }
    .act-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--link) 22%, transparent); }
    .act-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .act-note { font-size: 11.5px; color: var(--ink-dim); }
    .act-note.err { color: var(--down); }

    /* ---- rows (sessions, listeners) ------------------------------------ */
    .rows { display: flex; flex-direction: column; gap: 2px; }
    .row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 8px; border-radius: 6px; font-family: var(--mono); font-size: 12px;
    }
    .row:hover { background: var(--panel-raised); }
    .row .rdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint);
                 flex: none; }
    .row.up .rdot   { background: var(--up); }
    .row.down .rdot { background: var(--ink-faint); }
    .row .rid    { color: var(--link); min-width: 24px; }
    .row .rverb  { color: var(--ink); min-width: 66px; }
    .row .rmuted { color: var(--ink-dim); }
    .row .rgrow  { flex: 1; }
    .row .own {
      font-family: var(--sans); font-size: 9.5px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--warn);
      border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
      border-radius: 4px; padding: 0 5px;
    }
    .stop-btn {
      background: transparent; color: var(--ink-dim); border: 1px solid var(--line);
      border-radius: 5px; padding: 2px 9px; cursor: pointer; font-size: 11px;
      font-family: var(--sans);
    }
    .stop-btn:hover { color: var(--down); border-color: color-mix(in srgb, var(--down) 50%, transparent); }
    .empty { color: var(--ink-faint); font-style: italic; padding: 6px 8px; font-size: 12px;
             font-family: var(--sans); }

    /* ---- terminal ------------------------------------------------------ */
    .termwrap { flex: 1; display: flex; flex-direction: column; min-height: 220px;
                border-top: 1px solid var(--line); }
    .term-head {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 14px; background: var(--panel); font-size: 12px;
    }
    .term-head .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-faint); }
    .term-head .dot.up { background: var(--up); }
    .term-head .dot.down { background: var(--down); }
    .term-head .thlabel { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.13em;
                          color: var(--ink-faint); font-weight: 600; }
    .term-head #status { font-family: var(--mono); color: var(--ink-dim); }
    #term { flex: 1; padding: 6px 8px; background: #0f131b; min-height: 0; }

    :focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="mark"></span> argo-anywhere <span class="tag">web</span></div>
      <div class="meta" id="meta">…</div>
      <span class="spacer"></span>
      <button id="toggleDash" class="ghost-btn" aria-expanded="true">Hide dashboard</button>
    </header>

    <section class="dash" id="dash" aria-label="Channel dashboard">
      <div class="card channel">
        <div class="eyebrow">Channel</div>
        <div class="signalpath">
          <div class="hop up" id="hopLaptop">
            <span class="hopdot"></span><span class="hoplabel">this laptop</span>
            <span class="hopsub">local</span>
          </div>
          <div class="wire" id="wireTunnel"><span class="wirelabel" id="portLabel">:—</span></div>
          <div class="hop unknown" id="hopNode">
            <span class="hopdot"></span><span class="hoplabel">node</span>
            <span class="hopsub" id="nodeSub">—</span>
          </div>
          <div class="wire" id="wireProxy"></div>
          <div class="hop unknown" id="hopProxy">
            <span class="hopdot"></span><span class="hoplabel">argo-proxy</span>
            <span class="hopsub" id="proxySub">not checked</span>
          </div>
        </div>
        <div class="channel-meta" id="channelMeta"></div>
        <div class="channel-actions">
          <button id="checkHealth" class="act-btn">Check health</button>
          <span class="act-note" id="healthNote">health check reaches the node through the tunnel</span>
        </div>
      </div>

      <div class="card sessions">
        <div class="eyebrow">Sessions <span class="count" id="sessCount"></span></div>
        <div class="rows" id="sessions"></div>
      </div>

      <div class="card listeners">
        <div class="eyebrow">Loopback listeners</div>
        <div class="rows" id="listeners"></div>
      </div>
    </section>

    <section class="termwrap">
      <div class="term-head">
        <span class="dot" id="conn"></span>
        <span class="thlabel">Terminal</span>
        <span id="status">connecting…</span>
        <span class="spacer" style="margin-left:auto"></span>
        <button id="sigint" class="ghost-btn" title="Send Ctrl-C to the child">Ctrl-C</button>
      </div>
      <div id="term"></div>
    </section>
  </div>

  <script src="/static/xterm.js"></script>
  <script src="/static/xterm-addon-fit.js"></script>
  <script>
    // ===================================================================
    // Terminal + WebSocket bridge (unchanged behavior from P0/P1)
    // ===================================================================
    const term = new Terminal({
      cursorBlink: true,
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
      fontSize: 13,
      theme: { background: '#0f131b' },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('term'));
    fit.fit();

    const conn = document.getElementById('conn');
    const statusEl = document.getElementById('status');
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = 'arraybuffer';

    const CTRL = '\x00CTRL';
    const EXIT = '\x00EXIT';
    const dec = new TextDecoder();

    function sendResize() {
      if (ws.readyState !== WebSocket.OPEN) return;
      ws.send(CTRL + JSON.stringify({ op: 'resize', rows: term.rows, cols: term.cols }));
    }

    ws.onopen = () => {
      conn.classList.add('up');
      statusEl.textContent = 'connected';
      requestAnimationFrame(() => { fit.fit(); sendResize(); term.focus(); });
      refreshStatus();  // pull the dashboard as soon as the child is running
    };
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        if (ev.data.startsWith(EXIT)) {
          let info = {};
          try { info = JSON.parse(ev.data.slice(EXIT.length)); } catch (e) {}
          term.write(`\r\n\x1b[33m[process exited: status=${info.exitstatus}]\x1b[0m\r\n`);
          statusEl.textContent = `exited (status=${info.exitstatus})`;
          refreshStatus();
          return;
        }
        term.write(ev.data);
      } else {
        term.write(dec.decode(new Uint8Array(ev.data)));
      }
    };
    ws.onclose = () => {
      conn.classList.remove('up'); conn.classList.add('down');
      statusEl.textContent = 'disconnected';
    };
    ws.onerror = () => { statusEl.textContent = 'ws error'; };

    term.onData((data) => { if (ws.readyState === WebSocket.OPEN) ws.send(data); });
    window.addEventListener('resize', () => { fit.fit(); sendResize(); });
    term.onResize(() => sendResize());
    document.getElementById('sigint').addEventListener('click', () => {
      if (ws.readyState === WebSocket.OPEN) ws.send(CTRL + JSON.stringify({ op: 'signal', sig: 'INT' }));
      term.focus();
    });

    // ===================================================================
    // Dashboard (P2): local status auto-refresh + on-demand health
    // ===================================================================
    const el = (id) => document.getElementById(id);
    let cachedPort = null;

    function fmtUptime(s) {
      s = Math.floor(s);
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60), r = s % 60;
      if (m < 60) return m + 'm' + (r ? ' ' + r + 's' : '');
      const h = Math.floor(m / 60);
      return h + 'h ' + (m % 60) + 'm';
    }

    async function refreshStatus() {
      let data;
      try {
        const r = await fetch('/api/status', { cache: 'no-store' });
        data = await r.json();
      } catch (e) { return; }

      // versions
      const p = data.package || {};
      el('meta').innerHTML =
        `pkg <b>${p.package_version || '?'}</b> · engine <b>${p.engine_version || '?'}</b>` +
        ` <span style="opacity:.6">${p.engine_sha256_short || ''}</span>`;

      // channel: cached identity + tunnel liveness (a loopback listener on the port)
      const st = data.cached || {};
      cachedPort = st.port || null;
      const listeners = data.listeners || [];
      const tunnelUp = cachedPort && listeners.some((l) => l.port === cachedPort);

      el('portLabel').textContent = cachedPort ? (':' + cachedPort) : ':—';
      setHop('hopNode', tunnelUp ? 'up' : 'unknown');
      el('nodeSub').textContent = st.node ? shortNode(st.node) : '—';
      setWire('wireTunnel', 'up', tunnelUp ? 'up' : 'faint');
      setWire('wireProxy', tunnelUp ? 'up' : 'faint', 'faint');

      el('channelMeta').innerHTML =
        `user <b>${st.user || '—'}</b>` +
        `node <b>${st.node || '—'}</b>` +
        `port <b>${cachedPort || '—'}</b>` +
        `tunnel <b style="color:${tunnelUp ? 'var(--up)' : 'var(--ink-dim)'}">${tunnelUp ? 'up' : 'down'}</b>`;

      el('checkHealth').disabled = !tunnelUp;
      if (!tunnelUp) { setHop('hopProxy', 'unknown'); el('proxySub').textContent = 'no tunnel'; }

      renderSessions(data.sessions || []);
      renderListeners(listeners);
    }

    function shortNode(n) { return n.split('.')[0]; }

    function setHop(id, cls) {
      const h = el(id);
      h.classList.remove('up', 'down', 'unknown');
      h.classList.add(cls);
    }
    function setWire(id, from, to) {
      const c = (k) => k === 'up' ? 'var(--up)' : (k === 'down' ? 'var(--down)' : 'var(--ink-faint)');
      const w = el(id);
      w.style.setProperty('--from', c(from));
      w.style.setProperty('--to', c(to));
    }

    function renderSessions(sessions) {
      el('sessCount').textContent = sessions.length ? `(${sessions.length})` : '';
      const box = el('sessions');
      if (!sessions.length) { box.innerHTML = '<div class="empty">no managed sessions</div>'; return; }
      box.innerHTML = '';
      for (const s of sessions) {
        const row = document.createElement('div');
        row.className = 'row ' + (s.alive ? 'up' : 'down');
        const state = s.alive ? ('up ' + fmtUptime(s.uptime_s)) : `exited (${s.exitstatus})`;
        row.innerHTML =
          `<span class="rdot"></span>` +
          `<span class="rid">${s.id}</span>` +
          `<span class="rverb">${s.verb}</span>` +
          `<span class="rmuted">pid ${s.pid}</span>` +
          `<span class="rmuted">${state}</span>` +
          `<span class="rgrow"></span>` +
          (s.owns_channel ? `<span class="own" title="holds the SSH channel">channel</span>` : '');
        if (s.alive) {
          const b = document.createElement('button');
          b.className = 'stop-btn'; b.textContent = 'Stop';
          b.addEventListener('click', () => stopSession(s.id));
          row.appendChild(b);
        }
        box.appendChild(row);
      }
    }

    function renderListeners(listeners) {
      const box = el('listeners');
      if (!listeners.length) { box.innerHTML = '<div class="empty">no loopback listeners</div>'; return; }
      box.innerHTML = '';
      for (const l of listeners) {
        const row = document.createElement('div');
        row.className = 'row up';
        const tag = l.port === cachedPort ? ' <span class="rmuted">(tunnel)</span>'
                  : (l.port === 8799 ? ' <span class="rmuted">(web ui)</span>' : '');
        row.innerHTML =
          `<span class="rdot"></span>` +
          `<span class="rid">:${l.port}</span>` +
          `<span class="rverb">${l.command}</span>` +
          `<span class="rmuted">pid ${l.pid}</span>${tag}`;
        box.appendChild(row);
      }
    }

    // On-demand only: this GET traverses the tunnel to the node. Never auto-run.
    el('checkHealth').addEventListener('click', async () => {
      if (!cachedPort) return;
      const note = el('healthNote');
      note.classList.remove('err');
      el('checkHealth').disabled = true;
      el('proxySub').textContent = 'checking…';
      note.textContent = 'contacting argo-proxy…';
      try {
        const r = await fetch('/api/health?port=' + cachedPort, { cache: 'no-store' });
        const h = await r.json();
        if (h.up) {
          setHop('hopProxy', 'up');
          setWire('wireProxy', 'up', 'up');
          el('proxySub').textContent = h.latency_ms + ' ms';
          note.textContent = `healthy · ${h.status || 'ok'}`;
        } else {
          setHop('hopProxy', 'down');
          el('proxySub').textContent = 'no answer';
          note.textContent = 'no /health response through the tunnel';
          note.classList.add('err');
        }
      } catch (e) {
        note.textContent = 'health check failed'; note.classList.add('err');
      } finally {
        el('checkHealth').disabled = false;
      }
    });

    async function stopSession(id) {
      let r = await fetch(`/api/sessions/${id}/stop`, { method: 'POST' });
      if (r.status === 409) {
        const w = await r.json();
        if (!confirm(w.detail + '\n\nStop it anyway?')) return;
        r = await fetch(`/api/sessions/${id}/stop?force=true`, { method: 'POST' });
      }
      refreshStatus();
    }

    // Dashboard toggle.
    el('toggleDash').addEventListener('click', () => {
      const d = el('dash');
      const hidden = d.hasAttribute('hidden');
      if (hidden) d.removeAttribute('hidden'); else d.setAttribute('hidden', '');
      el('toggleDash').textContent = hidden ? 'Hide dashboard' : 'Show dashboard';
      el('toggleDash').setAttribute('aria-expanded', String(hidden));
      fit.fit(); sendResize();
    });

    // Auto-refresh LOCAL status only (no health). Pause when the tab is hidden.
    let timer = setInterval(() => { if (!document.hidden) refreshStatus(); }, 5000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStatus(); });
    refreshStatus();
  </script>
</body>
</html>
